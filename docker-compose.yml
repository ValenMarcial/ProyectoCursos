name: proyecto-cursos-dev

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOAD_SEED_DATA: ${LOAD_SEED_DATA:-true}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - ./infra/db/sql:/db-sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flowable-net

  flowable:
    image: flowable/flowable-ui:6.8.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME:
        org.postgresql.Driver
      SPRING_DATASOURCE_URL:
        jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # No autodesplegar el BPMN que viene dentro del .jar: se despliega con `make deploy`
      FLOWABLE_CHECK_PROCESS_DEFINITIONS: "false"
    # Mismo arranque que /flowable-entrypoint.sh de la imagen, sumando /opt/proyecto/lib al classpath
    entrypoint:
      - sh
      - -c
      - exec java $$JAVA_OPTS -Djava.awt.headless=true -Dfile.encoding=UTF-8 -cp '/app:/app/WEB-INF/classes:/app/WEB-INF/lib/*:/opt/proyecto/lib/*' org.flowable.ui.application.FlowableUiApplication
    volumes:
      # Nuestro .jar + Drools (se genera con `make build`)
      - ./target/flowable-lib:/opt/proyecto/lib:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - flowable-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      flowable:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      FLOWABLE_REST_URL: http://flowable:8080/flowable-ui/process-api
      FLOWABLE_USER: ${FLOWABLE_USER:-admin}
      FLOWABLE_PASSWORD: ${FLOWABLE_PASSWORD:-test}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - flowable-net

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - flowable-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  flowable-net:
    driver: bridge
