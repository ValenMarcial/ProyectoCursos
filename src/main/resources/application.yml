server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      # La sesión del personal vence después de 30 minutos sin uso.
      timeout: 30m
      cookie:
        # Lax: el navegador no manda la cookie de sesión en pedidos POST que vienen de otros sitios.
        same-site: lax

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/institucion}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

flowable:
  rest:
    base-url: ${FLOWABLE_REST_URL:http://localhost:8080/flowable-ui/process-api}
    username: ${FLOWABLE_USER:admin}
    password: ${FLOWABLE_PASSWORD:test}
