<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso para empresas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecera">
    <h1>Acceso para empresas</h1>
    <p>Ingrese con la cuenta que le habilitamos al aceptar una propuesta.</p>
  </header>

  <main class="contenedor">

    <div class="acceso">
      
      <div id="notification" class="notification" role="alert" hidden></div>

      <form id="form-login" class="formulario">

        <fieldset>
          <legend>Ingreso</legend>

          <div class="campo">
            <label for="usuario">Usuario *</label>
            <input type="text" id="usuario" name="usuario" maxlength="320"
                   autocomplete="username" required>
            <span class="ayuda">Normalmente es el correo electrónico de contacto de su solicitud.</span>
          </div>

          <div class="campo">
            <label for="clave">Contraseña *</label>
            <input type="password" id="clave" name="clave"
                   autocomplete="current-password" required>
          </div>
        </fieldset>

        <button type="submit" id="ingresar" class="boton-de-accion">Ingresar</button>
      </form>

      <p class="ayuda">
        ¿Todavía no tiene cuenta? Se crea cuando acepta una propuesta.
        Puede <a href="../public/request.html">solicitar una capacitación</a>.
      </p>

    </div>

  </main>

  <footer class="pie">
    <p><a href="../index.html">Volver al inicio</a></p>
  </footer>

  <script type="module" src="js/login.js"></script>
</body>
</html>
