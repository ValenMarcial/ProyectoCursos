<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar y elaborar propuesta</title>
  <link rel="stylesheet" href="css/administracion.css">
</head>
<body>

  <header class="cabecera">
    <h1>Registrar y elaborar propuesta</h1>
    <p>Administración</p>
  </header>

  <main class="contenedor">

    <!-- Aviso de errores y de resultado -->
    <p id="aviso" class="aviso" role="alert" hidden></p>

    <!-- Sección con los datos de la solicitud -->
    <section id="bloque-solicitud" class="bloque" hidden>
      <h2>Datos de la solicitud</h2>
      <div class="tarjeta">
        <dl id="datos-solicitud" class="datos"></dl>
      </div>
    </section>

    <!-- Sección con el formulario de la propuesta -->
    <section id="bloque-propuesta" class="bloque" hidden>
      <h2>Propuesta</h2>
      <div class="tarjeta">
        <!-- novalidate: los errores los muestra el módulo de la pantalla, en español y juntos -->
        <form id="formulario-propuesta" class="formulario" novalidate>
          <div class="campo">
            <label for="programa">Programa del curso</label>
            <textarea id="programa" name="programa" required></textarea>
          </div>

          <div class="campo">
            <label for="presupuesto">Presupuesto ($)</label>
            <input id="presupuesto" name="presupuesto" type="number" min="0" step="1" inputmode="numeric" required>
          </div>

          <div class="campos-en-fila">
            <div class="campo">
              <label for="fecha-inicio">Fecha de inicio posible</label>
              <input id="fecha-inicio" name="fecha-inicio" type="date" max="9999-12-31" required>
            </div>

            <div class="campo">
              <label for="fecha-fin">Fecha de finalización posible</label>
              <input id="fecha-fin" name="fecha-fin" type="date" max="9999-12-31" required>
            </div>
          </div>

          <button id="boton-completar" class="boton" type="submit">Registrar propuesta y generar PDF</button>
        </form>
      </div>
    </section>

    <!-- Sección que aparece cuando la tarea ya se completó -->
    <section id="bloque-resultado" class="bloque" hidden>
      <button id="boton-descargar" class="boton boton-secundario" type="button">Descargar PDF</button>
    </section>

  </main>

  <footer class="pie">
    <a href="../index.html">Volver a la portada</a>
  </footer>

  <!-- jsPDF 4.2.1, copia local (licencia MIT en js/vendor/jspdf.LICENSE). Script clásico: expone window.jspdf -->
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script type="module" src="js/registrar-propuesta.js"></script>

</body>
</html>
